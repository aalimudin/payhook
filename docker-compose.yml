services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: payhook
      POSTGRES_PASSWORD: payhook
      POSTGRES_DB: payhook
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payhook"]
      interval: 2s
      retries: 15
  payhook:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://payhook:payhook@db:5432/payhook?sslmode=disable
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
